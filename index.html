<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mindra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <button id="open" type="button">Open MD file</button>
    <button id="new" type="button">New</button>
    <button id="add-child" type="button" title="Add a child to the selected node (Tab)">Add child</button>
    <button id="add-topic" type="button" title="Add a new top-level topic (same level as the top topics)">Add topic</button>
    <button id="rename" type="button" title="Rename the selected node (Enter, or double-click)">Rename</button>
    <button id="settings" type="button" title="Theme, colors, and font">Settings</button>
    <button id="chat-toggle" type="button" title="Show or hide the AI chat on the right">AI chat</button>
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <button id="zoom-in" type="button" aria-label="Zoom in">＋</button>
    <span id="status" class="status">Open a file to begin</span>
  </header>
  <div class="body-row">
    <main id="view" class="view"></main>
    <aside id="chat-panel" class="chat" aria-label="AI chat" hidden>
      <div class="chat-head">
        <div class="chat-ai" role="tablist">
          <button type="button" class="chat-ai-btn is-on" data-ai="claude">Claude</button>
          <button type="button" class="chat-ai-btn" data-ai="codex">Codex</button>
          <button type="button" class="chat-ai-btn" data-ai="ollama">Ollama</button>
        </div>
        <button id="chat-close" type="button" aria-label="Close AI chat">×</button>
      </div>
      <div id="chat-focus" class="chat-focus" hidden>
        <span></span>
        <button id="chat-focus-clear" type="button" aria-label="Detach this line">×</button>
      </div>
      <div id="chat-log" class="chat-log"></div>
      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" rows="3" placeholder="Ask the AI about this map (Enter to send, Shift+Enter for a new line)"></textarea>
        <button type="submit">Send</button>
      </form>
    </aside>
  </div>

  <dialog id="new-dialog">
    <form method="dialog">
      <h2>New diagram type</h2>
      <label><input type="radio" name="view" value="mindmap" checked> Mind map</label>
      <label><input type="radio" name="view" value="flowchart"> Flowchart</label>
      <label><input type="radio" name="view" value="table"> Table</label>
      <label><input type="radio" name="view" value="sequence"> Sequence diagram</label>
      <label><input type="radio" name="view" value="timeline"> Timeline</label>
      <label><input type="radio" name="view" value="kanban"> Kanban</label>
      <label><input type="radio" name="view" value="roadmap"> Roadmap</label>
      <label><input type="radio" name="view" value="checklist"> Checklist</label>
      <label><input type="radio" name="view" value="bar"> Bar chart</label>
      <label><input type="radio" name="view" value="pie"> Pie chart</label>
      <label><input type="radio" name="view" value="line"> Line chart</label>
      <label><input type="radio" name="view" value="swot"> SWOT (4 boxes)</label>
      <label><input type="radio" name="view" value="logictree"> Logic tree</label>
      <label><input type="radio" name="view" value="gantt"> Gantt chart</label>
      <label><input type="radio" name="view" value="radar"> Radar chart</label>
      <label><input type="radio" name="view" value="quadrant"> Quadrant</label>
      <label><input type="radio" name="view" value="scatter"> Scatter plot</label>
      <label><input type="radio" name="view" value="orgchart"> Org chart</label>
      <label><input type="radio" name="view" value="state"> State diagram</label>
      <label><input type="radio" name="view" value="fishbone"> Fishbone</label>
      <label><input type="radio" name="view" value="er"> ER diagram</label>
      <label><input type="radio" name="view" value="network"> Network</label>
      <label><input type="radio" name="view" value="swimlane"> Swimlane</label>
      <label><input type="radio" name="view" value="pyramid"> Pyramid</label>
      <label><input type="radio" name="view" value="funnel"> Funnel</label>
      <label><input type="radio" name="view" value="gauge"> Gauge</label>
      <label><input type="radio" name="view" value="heatmap"> Heatmap</label>
      <label><input type="radio" name="view" value="calendar"> Calendar</label>
      <div class="dialog-actions">
        <button id="new-cancel" type="button">Cancel</button>
        <button id="new-confirm" type="submit">Choose location</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog">
    <form method="dialog">
      <h2>Settings</h2>
      <label>Theme
        <select id="set-theme">
          <option value="system">System (follow OS)</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="black">Black</option>
          <option value="pink">Pink</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
        </select>
      </label>
      <label>Font
        <select id="set-font">
          <option value="system">System</option>
          <option value="mincho">Mincho (serif)</option>
          <option value="rounded">Rounded</option>
          <option value="mono">Monospace</option>
        </select>
      </label>
      <label>Line color <input id="set-line" type="color"></label>
      <label>Text color <input id="set-text" type="color"></label>
      <label>Comment color <input id="set-comment" type="color"></label>
      <h3 class="section">Selected item color</h3>
      <p class="hint">Select an item on the map, then click a color.</p>
      <div id="item-swatches" class="swatches"></div>
      <h3 class="section">Item colors</h3>
      <div id="set-palette"></div>
      <div class="dialog-actions">
        <button id="set-reset" type="button">Reset to default</button>
        <button id="set-close" type="submit">Close</button>
      </div>
    </form>
  </dialog>

  <script src="src/parse.js"></script>
  <script src="src/render.js"></script>
  <script src="src/view-kit.js"></script>
  <script src="src/view-flowchart.js"></script>
  <script src="src/view-table.js"></script>
  <script src="src/view-sequence.js"></script>
  <script src="src/view-timeline.js"></script>
  <script src="src/view-kanban.js"></script>
  <script src="src/view-roadmap.js"></script>
  <script src="src/view-checklist.js"></script>
  <script src="src/view-bar.js"></script>
  <script src="src/view-pie.js"></script>
  <script src="src/view-line.js"></script>
  <script src="src/view-swot.js"></script>
  <script src="src/view-logictree.js"></script>
  <script src="src/view-gantt.js"></script>
  <script src="src/view-radar.js"></script>
  <script src="src/view-quadrant.js"></script>
  <script src="src/view-scatter.js"></script>
  <script src="src/view-orgchart.js"></script>
  <script src="src/view-state.js"></script>
  <script src="src/view-fishbone.js"></script>
  <script src="src/view-er.js"></script>
  <script src="src/view-network.js"></script>
  <script src="src/view-swimlane.js"></script>
  <script src="src/view-pyramid.js"></script>
  <script src="src/view-funnel.js"></script>
  <script src="src/view-gauge.js"></script>
  <script src="src/view-heatmap.js"></script>
  <script src="src/view-calendar.js"></script>
  <script src="src/watch.js"></script>
  <script src="src/edit.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
